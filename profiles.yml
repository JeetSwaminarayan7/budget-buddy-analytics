# Kept in the project so it runs with no setup. dbt looks here first
# when you run commands from the project folder.
#
#   dbt build                    -> DuckDB, a local file, nothing to set up
#   dbt build --target bigquery  -> Google BigQuery (see README)

budget_buddy_analytics:
  target: dev
  outputs:

    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'budget_buddy.duckdb') }}"
      threads: 4

    bigquery:
      type: bigquery
      # Uses the login from `gcloud auth application-default login`
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'set-the-GCP_PROJECT-variable') }}"
      dataset: budget_buddy
      location: EU
      threads: 4
      job_execution_timeout_seconds: 300
      # Stops a mistake from scanning more than 1 GB in one query
      maximum_bytes_billed: 1000000000
